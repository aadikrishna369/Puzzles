<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Images → PDF</title>
<style>
:root{--bg:#0a0b10;--panel:#12141c;--line:#232634;--text:#e8eaf2;--mute:#8a90a6;--a:#7c8cff;--b:#46d9ff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
.glow{position:fixed;inset:0;z-index:-1;overflow:hidden}
.glow i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(110px);opacity:.16;animation:drift 24s ease-in-out infinite alternate}
.glow i:nth-child(1){background:var(--a);top:-25vmax;left:-15vmax}
.glow i:nth-child(2){background:var(--b);bottom:-30vmax;right:-15vmax;animation-delay:-9s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.12)}}
main{max-width:980px;margin:0 auto;padding:56px 20px 120px}
header{text-align:center;margin-bottom:34px;animation:rise .8s both}
h1{font-size:clamp(28px,5vw,44px);margin:0 0 8px;letter-spacing:-.02em;background:linear-gradient(120deg,#fff,var(--a) 60%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:0;color:var(--mute)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#drop{position:relative;border:1.5px dashed #343852;border-radius:20px;background:rgba(18,20,28,.7);padding:46px 20px;text-align:center;cursor:pointer;transition:.25s;animation:rise .8s .1s both}
#drop:hover,#drop.over{border-color:var(--a);background:rgba(124,140,255,.07);box-shadow:0 0 0 6px rgba(124,140,255,.07),0 20px 60px -20px rgba(124,140,255,.35)}
#drop svg{width:44px;height:44px;stroke:var(--a);fill:none;stroke-width:1.6;animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
#drop b{display:block;margin-top:10px;font-size:17px}
#drop span{color:var(--mute);font-size:13.5px}
#drop u{color:var(--b);text-decoration:none;border-bottom:1px solid rgba(70,217,255,.4)}
.bar{display:none;margin:30px 0 14px;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar.show{display:flex;animation:rise .5s both}
.count{color:var(--mute)}.count b{color:var(--text)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{background:none;border:0;color:var(--mute);padding:7px 14px;border-radius:9px;cursor:pointer;font:inherit;font-size:13.5px;transition:.2s}
.seg button.on{background:#222640;color:var(--text)}
.link{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;font-size:13.5px;padding:7px 10px;border-radius:9px;transition:.2s}
.link:hover{color:#ff7c8c;background:rgba(255,124,140,.08)}
.hint{color:var(--mute);font-size:12.5px;margin:0 0 14px;display:none}
.hint.show{display:block}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:grab;transition:transform .2s,border-color .2s,box-shadow .2s,opacity .2s}
.card.fresh{animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(10px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-3px);border-color:#3b4060;box-shadow:0 16px 36px -16px rgba(0,0,0,.8)}
.card.drag{opacity:.35;transform:scale(.96)}
.card .img{aspect-ratio:1;background:#0d0f16 center/contain no-repeat}
.card .meta{padding:8px 10px;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--line)}
.num{position:absolute;top:8px;left:8px;min-width:24px;height:24px;border-radius:12px;padding:0 7px;background:rgba(10,11,16,.78);backdrop-filter:blur(6px);border:1px solid var(--line);font-size:12px;display:grid;place-items:center}
.tools{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transform:translateY(-4px);transition:.2s}
.card:hover .tools,.card:focus-within .tools{opacity:1;transform:none}
@media(hover:none){.tools{opacity:1;transform:none}}
.tools button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:rgba(10,11,16,.82);color:var(--text);cursor:pointer;font-size:13px;line-height:1;transition:.15s}
.tools button:hover{background:var(--a);border-color:var(--a)}
.tools button.x:hover{background:#ff5d73;border-color:#ff5d73}
.dock{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);transition:transform .5s cubic-bezier(.2,.9,.3,1.1);z-index:5}
.dock.show{transform:translate(-50%,0)}
#go{border:0;color:#08090e;font:inherit;font-weight:650;font-size:15.5px;padding:15px 30px;border-radius:16px;cursor:pointer;background:linear-gradient(120deg,var(--a),var(--b));box-shadow:0 14px 40px -10px rgba(90,160,255,.6);transition:.25s;display:flex;align-items:center;gap:10px}
#go:hover{transform:translateY(-2px);box-shadow:0 18px 46px -8px rgba(90,160,255,.8)}
#go:disabled{opacity:.7;cursor:wait;transform:none}
.spin{width:16px;height:16px;border:2px solid rgba(0,0,0,.25);border-top-color:#08090e;border-radius:50%;animation:s .7s linear infinite;display:none}
#go:disabled .spin{display:block}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-80px);background:var(--panel);border:1px solid var(--line);padding:10px 18px;border-radius:12px;transition:.4s;z-index:9;font-size:14px}
.toast.show{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow"><i></i><i></i></div>
<main>
  <header>
    <h1>Images to PDF</h1>
    <p>Add your images, arrange them, and get a single PDF. Everything stays in your browser.</p>
  </header>

  <div id="drop" tabindex="0" role="button" aria-label="Add images">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
    <b>Drag &amp; drop images here</b>
    <span>or <u>browse your computer</u> · any number of files · JPG, PNG, WebP, GIF, BMP</span>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </div>

  <div class="bar" id="bar">
    <div class="count"><b id="n">0</b> images</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <div class="seg" id="mode">
        <button data-m="fit" class="on">Fit to image</button>
        <button data-m="a4">A4 pages</button>
      </div>
      <button class="link" id="clear">Clear all</button>
    </div>
  </div>
  <p class="hint" id="hint">Drag cards to reorder, or use the ◀ ▶ buttons. Page 1 is first.</p>
  <div id="grid"></div>
</main>

<div class="dock" id="dock">
  <button id="go"><span class="spin"></span><span id="gol">Convert to PDF</span></button>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const grid=$('#grid'),drop=$('#drop'),input=$('#file');
  let items=[],mode='fit',uid=0,dragEl=null;

  function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600)}

  function addFiles(list){
    const files=[...list].filter(f=>f.type.startsWith('image/'));
    if(!files.length){toast('No image files found');return}
    files.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
    files.forEach((f,i)=>{
      const it={id:++uid,file:f,url:URL.createObjectURL(f)};
      items.push(it);
      const el=makeCard(it);
      el.style.animationDelay=Math.min(i,12)*40+'ms';
      grid.appendChild(el);
    });
    sync();
  }

  function makeCard(it){
    const c=document.createElement('div');
    c.className='card fresh';c.draggable=true;c.dataset.id=it.id;
    c.innerHTML='<div class="img"></div><div class="num"></div><div class="tools"><button title="Move earlier" data-a="l">◀</button><button title="Move later" data-a="r">▶</button><button class="x" title="Remove" data-a="x">✕</button></div><div class="meta"></div>';
    c.querySelector('.img').style.backgroundImage='url("'+it.url+'")';
    c.querySelector('.meta').textContent=it.file.name;
    c.addEventListener('animationend',()=>c.classList.remove('fresh'));
    c.addEventListener('dragstart',e=>{dragEl=c;c.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','card')}catch(_){}});
    c.addEventListener('dragend',()=>{c.classList.remove('drag');dragEl=null;sync()});
    c.addEventListener('dragover',e=>{
      if(!dragEl||dragEl===c)return;
      e.preventDefault();
      const r=c.getBoundingClientRect();
      const after=(e.clientX-r.left)>r.width/2 && (e.clientY>r.top);
      grid.insertBefore(dragEl,after?c.nextSibling:c);
    });
    c.querySelector('.tools').addEventListener('click',e=>{
      const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
      if(a==='x'){const it2=items.find(x=>x.id==c.dataset.id);URL.revokeObjectURL(it2.url);c.remove()}
      if(a==='l'&&c.previousElementSibling)grid.insertBefore(c,c.previousElementSibling);
      if(a==='r'&&c.nextElementSibling)grid.insertBefore(c.nextElementSibling,c);
      sync();
    });
    return c;
  }

  function sync(){
    const order=[...grid.children].map(c=>+c.dataset.id);
    items=order.map(id=>items.find(i=>i.id===id)).filter(Boolean);
    [...grid.children].forEach((c,i)=>c.querySelector('.num').textContent=i+1);
    const has=items.length>0;
    $('#n').textContent=items.length;
    $('#bar').classList.toggle('show',has);
    $('#hint').classList.toggle('show',has);
    $('#dock').classList.toggle('show',has);
  }

  /* upload: click + drag/drop */
  drop.addEventListener('click',()=>input.click());
  drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()}});
  input.addEventListener('change',()=>{addFiles(input.files);input.value=''});
  ['dragenter','dragover'].forEach(t=>window.addEventListener(t,e=>{
    if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();drop.classList.add('over')}
  }));
  ['dragleave','drop'].forEach(t=>window.addEventListener(t,e=>{
    if(t==='drop'||e.relatedTarget===null)drop.classList.remove('over');
  }));
  window.addEventListener('drop',e=>{
    if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){e.preventDefault();addFiles(e.dataTransfer.files)}
  });

  $('#mode').addEventListener('click',e=>{
    const m=e.target.dataset.m;if(!m)return;mode=m;
    document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b===e.target));
  });
  $('#clear').addEventListener('click',()=>{items.forEach(i=>URL.revokeObjectURL(i.url));items=[];grid.innerHTML='';sync()});

  /* image -> JPEG bytes */
  function loadImg(url){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('decode'));im.src=url})}
  async function toJpeg(it){
    const im=await loadImg(it.url);
    const w=im.naturalWidth,h=im.naturalHeight;
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(im,0,0);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));
    return{w,h,data:new Uint8Array(await blob.arrayBuffer())};
  }

  /* minimal PDF writer (JPEG streams) */
  function buildPdf(pages){
    const enc=new TextEncoder(),parts=[],off=[];let len=0;
    const push=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
    const f=n=>(+n.toFixed(2)).toString();
    push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    const total=2+pages.length*3;
    off[1]=len;push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    off[2]=len;push('2 0 obj\n<< /Type /Pages /Count '+pages.length+' /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>\nendobj\n');
    pages.forEach((p,i)=>{
      const pn=3+i*3,cn=pn+1,im=pn+2;
      off[pn]=len;push(pn+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+f(p.pw)+' '+f(p.ph)+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+cn+' 0 R >>\nendobj\n');
      const cs='q '+f(p.dw)+' 0 0 '+f(p.dh)+' '+f(p.dx)+' '+f(p.dy)+' cm /Im0 Do Q';
      off[cn]=len;push(cn+' 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
      off[im]=len;push(im+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.data.length+' >>\nstream\n');
      push(p.data);push('\nendstream\nendobj\n');
    });
    const xr=len;
    let x='xref\n0 '+(total+1)+'\n0000000000 65535 f \n';
    for(let n=1;n<=total;n++)x+=String(off[n]).padStart(10,'0')+' 00000 n \n';
    push(x+'trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
    return new Blob(parts,{type:'application/pdf'});
  }

  function layout(p){
    if(mode==='a4'){
      const pw=595.28,ph=841.89,m=28,s=Math.min((pw-2*m)/p.w,(ph-2*m)/p.h);
      p.pw=pw;p.ph=ph;p.dw=p.w*s;p.dh=p.h*s;p.dx=(pw-p.dw)/2;p.dy=(ph-p.dh)/2;
    }else{
      const s=Math.min(1,842/Math.max(p.w,p.h));
      p.pw=p.dw=p.w*s;p.ph=p.dh=p.h*s;p.dx=p.dy=0;
    }
    return p;
  }

  $('#go').addEventListener('click',async()=>{
    const btn=$('#go'),lab=$('#gol');
    if(!items.length)return;
    btn.disabled=true;
    try{
      const pages=[];
      for(let i=0;i<items.length;i++){
        lab.textContent='Processing '+(i+1)+' / '+items.length+'…';
        pages.push(layout(await toJpeg(items[i])));
        await new Promise(r=>setTimeout(r,0));
      }
      lab.textContent='Building PDF…';
      const blob=buildPdf(pages),url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download='images.pdf';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),30000);
      toast('Your PDF is ready ('+items.length+(items.length>1?' pages':' page')+')');
    }catch(err){toast('Could not convert one of the images')}
    lab.textContent='Convert to PDF';btn.disabled=false;
  });
})();
</script>
</body>
</html>
